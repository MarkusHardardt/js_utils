<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc">
  <title id="title">Catenary chain between two supports</title>
  <desc id="desc">A sagging chain curve between two support points, with horizontal coordinates, height and tangent slope indicated.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#315b7d"/>
    </marker>
  </defs>
  <rect width="720" height="330" rx="14" fill="#f7f9fb"/>
  <g stroke="#8c9aa3" stroke-width="6" stroke-linecap="round">
    <path d="M130 82 V245"/>
    <path d="M590 82 V245"/>
  </g>
  <path d="M130 82 C250 278 470 278 590 82" fill="none" stroke="#c66b32" stroke-width="5"/>
  <g fill="#315b7d">
    <circle cx="130" cy="82" r="7"/>
    <circle cx="590" cy="82" r="7"/>
    <circle cx="360" cy="229" r="7"/>
  </g>
  <g stroke="#315b7d" stroke-width="2" marker-end="url(#arrow)">
    <path d="M85 270 H635"/>
    <path d="M95 245 V62"/>
    <path d="M360 229 L430 145"/>
  </g>
  <path d="M360 229 H450" fill="none" stroke="#738795" stroke-width="1.5" stroke-dasharray="5 5"/>
  <g font-family="Arial, sans-serif" fill="#253746">
    <text x="623" y="292" font-size="15">x</text>
    <text x="78" y="61" font-size="15">y</text>
    <text x="362" y="251" font-size="14">minimum</text>
    <text x="438" y="140" font-size="14">tangent</text>
    <text x="330" y="309" font-size="14">horizontal span</text>
    <text x="42" y="170" font-size="14">height</text>
  </g>
</svg>
